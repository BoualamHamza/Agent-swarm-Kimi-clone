[project]
name = "agent-swarm"
version = "0.1.0"
description = "DIY agent swarm with OpenRouter + LangSmith — orchestrator, parallel workers, shared memory, dynamic handoffs."
requires-python = ">=3.11"
dependencies = [
    "openai>=1.50",
    "pydantic>=2.9",
    "tavily-python>=0.5",
    "asteval>=0.9.31",
    "langsmith>=0.3.0",
    "fastapi>=0.115",
    "sse-starlette>=2.1",
    "uvicorn[standard]>=0.32",
    "python-dotenv>=1.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
